<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosa facciamo stasera?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 600px;
            padding: 45px 30px;
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        button {
            margin-top: 25px;
            padding: 18px 35px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #6c4ab6;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #risultato {
            margin-top: 30px;
            font-size: 25px;
            font-weight: bold;
            min-height: 35px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>✨ Cosa facciamo stasera?</h1>

        <p>Non sapete cosa fare?</p>
        <p>Ci penso io 😎</p>

        <button onclick="generaIdea()">
            🎲 TROVA QUALCOSA
        </button>

        <div id="risultato"></div>
    </div>

    <script>
        const idee = [
            "🎮 Fate una partita insieme",
            "🍿 Guardate un film",
            "🍕 Ordinate qualcosa di buono",
            "🎵 Ascoltate la vostra playlist",
            "😂 Guardate video stupidi e ridete",
            "🚶 Fate una passeggiata",
            "🧑‍🍳 Cucinate qualcosa insieme",
            "🎲 Fate un gioco di società",
            "💬 Fatevi domande a caso",
            "❤️ Organizzate un appuntamento",
            "🎨 Disegnate qualcosa",
            "📸 Fate delle foto divertenti"
        ];

        function generaIdea() {
            const casuale = Math.floor(Math.random() * idee.length);
            document.getElementById("risultato").textContent = idee[casuale];
        }
    </script>

</body>
</html>

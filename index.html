
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Cosa facciamo stasera?</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 15% 20%, rgba(96,165,250,.35), transparent 30%),
    radial-gradient(circle at 85% 80%, rgba(236,72,153,.35), transparent 30%),
    linear-gradient(135deg, #111827, #312e81, #581c87);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 850px;
  padding: 45px 35px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 30px;
  background: rgba(255,255,255,.10);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 9px 16px;
  margin-bottom: 22px;
  border-radius: 50px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
}

h1 {
  font-size: clamp(42px, 8vw, 76px);
  line-height: .95;
  margin-bottom: 20px;
  letter-spacing: -3px;
  text-shadow: 0 8px 30px rgba(0,0,0,.25);
}

.subtitle {
  color: rgba(255,255,255,.78);
  font-size: 19px;
  line-height: 1.5;
  margin-bottom: 32px;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 28px;
}

.category {
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.10);
  color: white;
  padding: 12px 18px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.category:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.18);
}

.category.active {
  background: white;
  color: #312e81;
  box-shadow: 0 8px 25px rgba(255,255,255,.15);
}

.result {
  min-height: 220px;
  border-radius: 25px;
  padding: 35px 25px;
  margin-bottom: 28px;
  background: rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: .3s;
}

.result-icon {
  font-size: 55px;
  margin-bottom: 15px;
}

.result h2 {
  font-size: 28px;
  margin-bottom: 10px;
}

.result p {
  color: rgba(255,255,255,.7);
  font-size: 16px;
  max-width: 550px;
  line-height: 1.5;
}

.result.show {
  animation: pop .4s ease;
}

@keyframes pop {
  0% {
    transform: scale(.96);
    opacity: .5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.main-button {
  border: none;
  padding: 18px 35px;
  border-radius: 50px;
  background: white;
  color: #312e81;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
  transition: .2s;
}

.main-button:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 18px 45px rgba(0,0,0,.35);
}

.main-button:active {
  transform: scale(.97);
}

.counter {
  margin-top: 18px;
  color: rgba(255,255,255,.55);
  font-size: 14px;
}

.footer {
  margin-top: 30px;
  color: rgba(255,255,255,.45);
  font-size: 13px;
}

@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  .container {
    padding: 30px 18px;
    border-radius: 24px;
  }

  h1 {
    letter-spacing: -2px;
  }

  .subtitle {
    font-size: 16px;
  }

  .result {
    min-height: 200px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="badge">🎲 IL GENERATORE DI SERATE</div>

  <h1>✨ Cosa facciamo<br>stasera?</h1>

  <p class="subtitle">
    Non avete idea di cosa fare?<br>
    Tranquilli. Ci pensa lui. 😎
  </p>

  <div class="categories">
[3/9, 15:54] Chat: <button class="category active" data-category="tutte">🎲 Tutte</button>
    <button class="category" data-category="casa">🏠 Casa</button>
    <button class="category" data-category="fuori">🌃 Fuori</button>
    <button class="category" data-category="amici">👥 Amici</button>
    <button class="category" data-category="relax">🧘 Relax</button>
  </div>

  <div class="result" id="result">
    <div class="result-icon">🎲</div>
    <h2>Premi il pulsante e scopri cosa fare!</h2>
    <p>
      Una serata senza idee? Nessun problema.
      Lascia scegliere al caso.
    </p>
  </div>

  <button class="main-button" id="generate">
    🎲 TROVA QUALCOSA
  </button>

  <div class="counter">
    Idee generate: <span id="counter">0</span>
  </div>

  <div class="footer">
    Fatto con ❤️ per le serate senza idee
  </div>

</div>

<script>
const ideas = {
  casa: [
    ["🎬", "Maratona di film", "Scegliete una saga o un film che nessuno ha mai visto."],
    ["🍕", "Pizza e film", "Ordinate o preparate una pizza e scegliete un film a caso."],
    ["🎮", "Torneo di videogiochi", "Organizzate una sfida e vediamo chi è davvero il campione."],
    ["🍿", "Serata cinema", "Luci spente, snack e film scelto con gli occhi chiusi."],
    ["🎲", "Giochi da tavolo", "Tirate fuori un gioco e preparatevi a litigare per vincere."],
    ["🍳", "Cucinate qualcosa", "Provate una ricetta nuova con quello che avete in casa."],
    ["🎤", "Karaoke", "Mettete le vostre canzoni preferite e cantate senza vergogna."],
    ["😂", "Serata meme", "Mandatevi i meme più assurdi che trovate e votate il migliore."]
  ],

  fuori: [
    ["🌃", "Passeggiata notturna", "Uscite senza una meta precisa e scoprite un posto nuovo."],
    ["🍔", "Andate a mangiare", "Scegliete un posto nuovo e provate qualcosa che non avete mai ordinato."],
    ["🍦", "Gelato di sera", "Un classico che non delude mai."],
    ["📸", "Foto challenge", "Uscite e provate a fare 10 foto creative in giro."],
    ["🚗", "Giro in macchina", "Musica alta, finestrini aperti e destinazione casuale."],
    ["🌆", "Esplorate la città", "Cercate un posto della vostra zona dove non siete mai stati."],
    ["☕", "Bar serale", "Trovate un locale tranquillo e fate due chiacchiere."]
  ],

  amici: [
    ["🎮", "Sfida tra amici", "Create un torneo e fate vincere il migliore."],
    ["🎤", "Karaoke di gruppo", "Scegliete le canzoni peggiori e cantatele tutti insieme."],
    ["😂", "Serata meme", "Chi riesce a far ridere tutti per primo vince."],
    ["🍕", "Pizza tutti insieme", "Pizza, musica e discussioni inutili fino a tardi."],
    ["🎲", "Gioco a sorpresa", "Ogni persona propone un gioco e si sceglie casualmente."],
    ["🏆", "Olimpiadi degli amici", "Inventate prove completamente stupide e assegnate punti."]
  ],

  relax: [
    ["🧘", "Serata relax", "Musica tranquilla, luci basse e zero stress."],
    ["🎧", "Musica e chill", "Preparate una playlist e ascoltatela senza fare altro."],
    ["📖", "Leggete qualcosa", "Un libro, un fumetto o qualsiasi cosa vi incuriosisca."],
    ["🌙", "Guardate le stelle", "Se il cielo è sereno, uscite e rilassatevi guardando le stelle."],
    ["🛋️", "Modalità divano", "Coperta, snack e assolutamente niente programmi."],
    ["🚿", "Reset totale", "Doccia, vestiti comodi, musica e serata completamente tranquilla."]
  ]
};

let currentCategory = "tutte";
let counter = 0;

const buttons = document.querySelectorAll(".category");
const generateButton = document.getElementById("generate");
const result = document.getElementById("result");
const counterElement = document.getElementById("counter");

buttons.forEach(button => {
  button.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    currentCategory = button.dataset.category;
  });
});
 function getIdeas() {
  if (currentCategory === "tutte") {
    return Object.values(ideas).flat();
  }

  return ideas[currentCategory];
}

function generateIdea() {
  const list = getIdeas();

  if (!list || list.length === 0) {
    return;
  }

  const randomIdea = list[Math.floor(Math.random() * list.length)];

  counter++;
  counterElement.textContent = counter;

  result.classList.remove("show");

  void result.offsetWidth;

  result.innerHTML = `
    <div class="result-icon">${randomIdea[0]}</div>
    <h2>${randomIdea[1]}</h2>
    <p>${randomIdea[2]}</p>
  `;

  result.classList.add("show");
}

generateButton.addEventListener("click", generateIdea);
</script>

</body>
</html>
